name: Update data and deploy

on:
  schedule:
    - cron: "17 * * * *"      # every hour: forecast + latest OpenAQ readings
    - cron: "41 19 * * 0"     # Monday 02:41 WIB: recompute calibration
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      calibrate:
        description: "Also recompute the OpenAQ calibration"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forecast inputs (CAMS PM2.5 nodes + apparent temperature)
        continue-on-error: true
        run: python scripts/fetch_forecast.py
      - name: Recompute calibration (weekly)
        if: github.event.schedule == '41 19 * * 0' || inputs.calibrate
        continue-on-error: true
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python scripts/update_calibration.py
      - name: Fetch latest OpenAQ readings
        continue-on-error: true
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python scripts/fetch_openaq_latest.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "data: OpenAQ update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main && git push
          fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
